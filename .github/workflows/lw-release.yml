name: Release 3X-UI Lightweight

on:
  workflow_dispatch:
  push:
    tags:
      - "lw-v*"

permissions:
  contents: write
  packages: write

jobs:
  native:
    name: Alpine package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build lightweight builder stage
        run: |
          rm -rf release-out
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --target builder \
            --output type=local,dest=release-out \
            --file Dockerfile.lw .
      - name: Package Alpine archive
        run: |
          set -eu
          test -x release-out/app/build/x-ui
          test -x release-out/app/build/bin/xray-linux-${{ matrix.arch }}
          mkdir -p package/x-ui
          cp -a release-out/app/build/. package/x-ui/
          tar -czf 3x-ui-lw-linux-${{ matrix.arch }}.tar.gz -C package x-ui
          sha256sum 3x-ui-lw-linux-${{ matrix.arch }}.tar.gz > 3x-ui-lw-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: 3x-ui-lw-linux-${{ matrix.arch }}
          path: |
            3x-ui-lw-linux-${{ matrix.arch }}.tar.gz
            3x-ui-lw-linux-${{ matrix.arch }}.tar.gz.sha256

  docker:
    name: Publish lightweight Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/csy6666/3x-ui-lw
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lw
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/lw-v')
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 3x-ui-lw-linux-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            3x-ui-lw-linux-*.tar.gz
            3x-ui-lw-linux-*.tar.gz.sha256
